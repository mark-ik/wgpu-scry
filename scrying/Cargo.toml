[package]
name = "scrying"
version = "0.7.0"
edition = "2024"
rust-version = "1.92"
license = "MPL-2.0"
repository = "https://github.com/merely-made/wgpu-scry"
description = "Capability-driven system-webview frame adapter for WebView2, WKWebView, WebKitGTK, and WPE"

[features]
default = ["wgpu-30"]
# Pick the row matching the host's wgpu. The newest enabled row wins when
# features unify, so --all-features remains useful.
wgpu-30 = [
    "dep:wgpu_30",
    "dep:wgpu_hal_30",
    "grafting/wgpu-30",
]
wgpu-29 = [
    "dep:wgpu_29",
    "dep:wgpu_hal_29",
    "grafting/wgpu-29",
]
wgpu-28 = [
    "dep:wgpu_28",
    "dep:wgpu_hal_28",
    "dep:metal",
    "dep:foreign-types-shared",
    "grafting/wgpu-28",
]
webkitgtk-fallback = [
    "dep:gdk",
    "dep:glib",
    "dep:gtk",
    "dep:javascriptcore",
    "dep:soup",
    "dep:webkit2gtk",
]
# Mutually exclusive with `webkitgtk-fallback` in practice (both pull
# incompatible glib / gtk crate-version trees). The producer-alias
# selection in `lib.rs` lets `webkit6` win if both are enabled, but
# expect noisier build output and a larger dependency graph.
webkit6 = ["dep:gtk4", "dep:gsk4", "dep:webkit6"]
# Hand-written WPEPlatform FFI producer (the planned Linux primary).
# Requires WPEWebKit dev libs at build time (Fedora 44):
#   sudo dnf install -y wpewebkit-devel libwpe-devel wpebackend-fdo-devel
# Links libWPEWebKit-2.0.so via pkg-config (wpe-webkit-2.0) in build.rs.
wpe = ["dep:glib", "dep:soup"]

[dependencies]
dpi.workspace = true
image = "0.25"
# Color-space conversion math used by the WKWebView producer's
# adaptive Display-P3 / extended-linear capture path. We only pull
# in the gamut conversions; no rendering-extras features.
palette = { version = "0.7", default-features = false, features = ["std"] }
thiserror = "2.0.17"
grafting = { version = "0.6.0", git = "https://github.com/merely-made/wgpu-graft.git", rev = "d671c9681332751f8ea24dd974511b81fe6a05dd", default-features = false }
wgpu_30 = { package = "wgpu", version = "30.0.1", features = ["metal"], optional = true }
wgpu_hal_30 = { package = "wgpu-hal", version = "30.0.1", optional = true }
wgpu_29 = { package = "wgpu", version = "29.0.1", features = ["metal"], optional = true }
wgpu_hal_29 = { package = "wgpu-hal", version = "29.0.1", optional = true }
wgpu_28 = { package = "wgpu", version = "28.0.0", features = ["metal"], optional = true }
wgpu_hal_28 = { package = "wgpu-hal", version = "28.0.0", optional = true }
[target.'cfg(target_os = "linux")'.dependencies]
# Phase 4a — Vulkan DMABUF import path in `native_frame::dmabuf`.
# wgpu-hal 29 pulls ash 0.38 transitively; pin to match. libc covers
# the small POSIX-fd plumbing the import needs (no other Linux deps).
ash = "0.38"
libc = "0.2"
# WebKitGTK Rust bindings (Tauri-maintained line, links against
# libwebkitgtk-4.1).
#
# System packages required at build time (one-time apt install):
#   sudo apt install -y libwebkit2gtk-4.1-dev libgtk-3-dev
# Plus pkg-config and build-essential (usually already present).
#
# `v2_40` selects the feature gate for the symbols available in
# libwebkit2gtk-4.1 ≥ 2.40 (Ubuntu 24.04 LTS ships 2.44, so this is
# the safe baseline). Bump if newer APIs are needed.
webkit2gtk = { version = "2.0", features = ["v2_40"], optional = true }
gtk = { version = "0.18", optional = true }
gdk = { version = "0.18", optional = true }
glib = { version = "0.18", optional = true }
# Pulls in JavaScriptCore Value introspection (`ValueExt::to_str`) so
# the JS-messaging path can extract strings out of `JavascriptResult`s
# delivered by the WebKit UserContentManager. Pinned to 1.1 to match
# webkit2gtk 2.0.2's transitive dep.
javascriptcore = { package = "javascriptcore-rs", version = "1.1", optional = true }
# libsoup 3 cookie type — the WebKit CookieManager API operates on
# `soup::Cookie` values. Pinned to 0.5 to match webkit2gtk 2.0.2's
# transitive dep.
soup = { package = "soup3", version = "0.5", optional = true }

# Modern gtk-rs GTK 4 + WebKitGTK 6.0 line for the parallel
# `webkit6_producer/` module. Pulls in glib 0.22 / gdk4 / gio 0.22 /
# soup3 0.9 / javascriptcore 1.x as transitives. System packages at
# build time:
#   sudo dnf install -y gtk4-devel webkitgtk6.0-devel
# The `v2_44` feature gate matches Fedora 44's webkitgtk6.0 2.52.3
# (≥ 2.44), opening the newer API surface (evaluate_javascript, etc.)
# Enable `v4_14` to unlock `gdk4::DmabufTexture` (and the type-check
# downcast the webkit6 producer's Phase A.8 paintable-render path
# performs against the rendered texture). Fedora 44 ships GTK 4.22, so
# 4.14 is the safe baseline. Also pulls `gdk4::TextureDownloader` in
# (already v4_10 / always present at 4.14+) — used by the same path's
# format-aware CPU-readback fallback.
gtk4 = { version = "0.11", features = ["v4_14"], optional = true }
# GSK is used by the webkit6 producer's Phase A.8 DMABUF-capture
# exploration: render-tree → render node → renderer.render_texture(). The
# resulting `GdkTexture` is then probed for `GdkDmabufTexture` to see if
# GTK actually hands us a DMABUF-backed texture on this stack.
gsk4 = { version = "0.11", optional = true }
webkit6 = { version = "0.6", features = ["v2_44"], optional = true }

[target.'cfg(target_os = "linux")'.dev-dependencies]
# Phase 4a.4 — round-trip test for `native_frame::dmabuf::import`.
# `gbm` allocates a producer-side DMABUF via Mesa's buffer allocator
# (the same path Wayland compositors / WebKit use under the hood);
# pollster runs wgpu's async device requests synchronously inside
# the test. System packages required at build time:
#   sudo dnf install -y mesa-libgbm-devel libdrm-devel
# (libdrm-devel is pulled in by gbm's transitive deps even though
# we don't link against libdrm directly in the test code.)
gbm = "0.18"
pollster = "0.4"
# Phase 4c.x — wpe_to_vulkan_roundtrip integration test needs to pump the
# GLib main context in its acquire-frame retry loop (the buffer-rendered
# signal fires on that context). `glib` is already a transitive dependency
# via the `wpe` feature; listing it here makes it directly available to the
# integration test binary without touching the library's own dependency list.
glib = "0.18"

[build-dependencies]
pkg-config = "0.3"

[target.'cfg(target_os = "macos")'.dependencies]
# wgpu-hal 28 exposes metal-rs handles; 29/30 expose objc2-metal handles. The
# public interop API stays objc2-shaped and converts only at the HAL boundary.
metal = { version = "0.33.0", optional = true }
foreign-types-shared = { version = "0.3.1", optional = true }
# The objc2-* crates cover producer-side WKWebView, ScreenCaptureKit, and
# IOSurface plumbing.
objc2 = "0.6.3"
objc2-foundation = "0.3.2"
objc2-app-kit = "0.3.2"
objc2-web-kit = "0.3.2"
objc2-screen-capture-kit = "0.3.2"
objc2-core-foundation = "0.3.2"
objc2-core-graphics = "0.3.2"
objc2-core-media = "0.3.2"
objc2-core-video = { version = "0.3.2", features = ["objc2-io-surface"] }
objc2-io-surface = "0.3.2"
objc2-metal = { version = "0.3.2", features = [
    "MTLAllocation",
    "MTLDevice",
    "MTLEvent",
    "MTLPixelFormat",
    "MTLResource",
    "MTLTexture",
    "objc2-io-surface",
] }
block2 = "0.6.2"
dispatch2 = "0.3.0"

[target.'cfg(target_os = "windows")'.dependencies]
webview2-com = "0.39.1"
windows-numerics = "0.3"
windows = { version = "0.62", features = [
    "Foundation",
    "System",
    "UI",
    "UI_Composition",
    "UI_Composition_Core",
    "UI_Composition_Desktop",
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Direct3D12",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Security",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Memory",
    "Win32_System_WinRT",
    "Win32_System_WinRT_Composition",
    "Win32_System_WinRT_Direct3D11",
    "Win32_System_WinRT_Graphics_Capture",
    "Win32_UI_WindowsAndMessaging",
    "Graphics_Capture",
    "Graphics_DirectX",
    "Graphics_DirectX_Direct3D11",
] }
