[workspace]
members = [
    "scrying",
    "demo-scrying-winit",
    "demo-win",
    "demo-mac",
    "demo-linux",
    "demo-linux6",
    "demo-wpe",
]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MPL-2.0"
repository = "https://github.com/merely-made/wgpu-scry"
version = "0.1.0"

# Demo/default pins. The scrying library carries feature-selected wgpu
# dependencies so hosts on adjacent majors do not have to move in lockstep.
[workspace.dependencies]
wgpu = "29"
winit = "0.30.13"
raw-window-handle = "0.6.2"
dpi = "0.1.2"
