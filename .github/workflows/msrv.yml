name: scrying MSRV

# This is the publishable `scrying` crate's MSRV gate. The demo workspace and
# the headed hardware workflows intentionally retain their Rust 1.97.1 lane.
#
# MSRV is a promise made at publication, so it is verified when a release is
# cut and on demand rather than on every push. The path filters that used to
# narrow the push trigger are gone with it.

on:
  push:
    tags: ["v*", "scrying-v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"

jobs:
  # Windows, macOS, and the Linux public API without an installed native
  # engine, each at wgpu-28/29/30. This was the `platform-api` job's nine-row
  # include list; the shared matrix produces the same nine cells. Each Linux
  # engine feature is compiled in its own native-family job below.
  platform-api:
    uses: merely-made/.github/.github/workflows/wgpu-msrv.yml@main
    with:
      crate: scrying
      toolchain: 1.92.0

  linux-webkitgtk-fallback:
    name: Rust 1.92 / Linux / WebKitGTK 4.1 fallback
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.92.0
      - name: Install WebKitGTK 4.1 build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev
      - name: Check the fallback producer family
        run: >-
          cargo check --locked -p scrying --lib --no-default-features
          --features wgpu-30,webkitgtk-fallback

  linux-wpe:
    name: Rust 1.92 / Linux / WPE
    runs-on: ubuntu-latest
    container: fedora:44

    steps:
      - name: Install WPE build dependencies
        run: |
          dnf install -y dnf-plugins-core git curl gcc gcc-c++ \
            pkgconf-pkg-config mesa-libgbm-devel libdrm-devel \
            vulkan-loader-devel
          dnf copr enable -y philn/wpewebkit
          dnf install -y wpewebkit-devel libwpe-devel wpebackend-fdo-devel
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.92.0
      - name: Check the WPE producer family
        run: >-
          cargo check --locked -p scrying --lib --no-default-features
          --features wgpu-30,wpe

  linux-webkit6:
    name: Rust 1.92 / Linux / WebKitGTK 6.0
    runs-on: ubuntu-latest
    container: fedora:44

    steps:
      - name: Install WebKitGTK 6.0 build dependencies
        run: >-
          dnf install -y git curl gcc gcc-c++ pkgconf-pkg-config
          gtk4-devel webkitgtk6.0-devel
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.92.0
      - name: Check the WebKitGTK 6.0 producer family
        run: >-
          cargo check --locked -p scrying --lib --no-default-features
          --features wgpu-30,webkit6
