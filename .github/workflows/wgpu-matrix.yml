name: wgpu matrix

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # ubuntu/macOS/Windows x wgpu-28/29/30 `cargo check` of the publishable
  # library row, exactly as before, with one change: the toolchain now comes
  # from rust-toolchain.toml rather than resolving `stable` at run time.
  #
  # run-clippy and run-fmt are deliberately false. This repository is not
  # clippy-clean or rustfmt-clean today, and turning either on here would land
  # a red badge that says nothing about the commit that triggered it. Flipping
  # them to true is a one-line change once the tree is clean; see wgpu-weld's
  # wgpu-matrix.yml, which has both on.
  gate:
    uses: merely-made/.github/.github/workflows/wgpu-check.yml@main
    with:
      crate: scrying
      run-clippy: false
      run-fmt: false
      # The library unit tests run under test-linux.yml and test-mac.yml, with
      # the system packages and Xvfb they need. Do not duplicate them here.
      test-row: ""
      rustflags: ""
      # Was the `host-wgpu-30` job: the portable host and the real WebView2
      # demo, Windows only.
      extra-packages: -p demo-scrying-winit -p demo-win
      extra-packages-os: '["windows-latest"]'
