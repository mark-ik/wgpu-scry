name: wgpu matrix

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: ${{ matrix.os }} / ${{ matrix.wgpu }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        wgpu: [wgpu-28, wgpu-29, wgpu-30]
    env:
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"

    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo check --locked -p scrying --lib --no-default-features --features ${{ matrix.wgpu }}

  host-wgpu-30:
    name: Windows wgpu 30 hosts
    runs-on: windows-latest
    env:
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"

    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Check portable host and real WebView2 demo
        run: cargo check --locked -p demo-scrying-winit -p demo-win
